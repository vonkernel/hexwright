name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request makes the previous run's answer irrelevant. Pushes
# to main are left to finish, because main's history is the record of what passed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # One version failing should not hide what the other would have said.
      fail-fast: false
      matrix:
        # The floor `engines` declares, and the current release. The tests run the
        # CLI as TypeScript through node itself, so the runtime's own handling of
        # that is part of what is under test rather than an assumption.
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci

      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: build
        run: npm run build

      # The suites that build their own synthetic repository. The two that assert
      # against a real codebase skip themselves unless HEXWRIGHT_TEST_REPO points
      # at one — nothing here depends on a particular machine or project.
      - name: test
        run: npm test
